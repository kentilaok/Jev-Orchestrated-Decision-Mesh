name: tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact commit without external actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Run standard-library unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -B -m unittest discover -s tests -p "test_*.py" -v

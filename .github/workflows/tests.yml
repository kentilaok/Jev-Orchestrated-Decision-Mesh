name: tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        shell: bash
        run: |
          set +e
          python -B -m unittest discover -s tests -p "test_*.py" -v 2>&1 | tee test-output.txt
          code=${PIPESTATUS[0]}
          echo "TEST_EXIT_CODE=${code}" >> "${GITHUB_ENV}"
          exit "${code}"
      - name: Upload unittest transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-transcript
          path: test-output.txt
          if-no-files-found: error

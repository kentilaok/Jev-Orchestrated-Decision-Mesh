name: Arsenal A2 tests

on:
  push:
    branches:
      - feature/recovery-first-experience-distillation
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/arsenal-a2-tests.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/arsenal-a2-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Arsenal and broker modules
        run: python -m compileall -q scripts tests
      - name: Test Arsenal registry, skills, shadow, calibration
        run: python -m unittest discover -s tests -p 'test_arsenal_*.py' -v
      - name: Test native broker integration
        run: python -m unittest discover -s tests -p 'test_native_transition_broker.py' -v
